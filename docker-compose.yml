services:
  db:
    image: postgres:16-alpine
    container_name: school-assoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_dev_password
      POSTGRES_DB: school_assoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_assoc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: